/* Art direction: interoperability operations desk. Neutral surfaces, one teal accent. */
:root{
  --font-body:"Satoshi",sans-serif;
  --text-xs:clamp(.75rem,.72rem + .12vw,.875rem);
  --text-sm:clamp(.875rem,.84rem + .12vw,1rem);
  --text-base:clamp(1rem,.98rem + .1vw,1.1rem);
  --text-lg:clamp(1.125rem,1.05rem + .3vw,1.4rem);
  --text-xl:clamp(1.5rem,1.3rem + .6vw,2rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;
  --color-bg:#f7f6f2;--color-surface:#fffefa;--color-surface-2:#efede7;
  --color-text:#28251d;--color-text-muted:#625f58;
  --color-primary:#01696f;--color-primary-text:#fff;
  --color-error:#9a2750;--color-warning:#8b421e;
  --color-divider:color-mix(in oklch,var(--color-text) 15%,transparent);
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#211f1b;--color-surface-2:#2c2924;
  --color-text:#efede6;--color-text-muted:#b9b4aa;
  --color-primary:#78c0c5;--color-primary-text:#132c2d;
  --color-error:#f4a0ba;--color-warning:#edb583;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.55;

h1{font-size:var(--text-xl);line-height:1.2;text-wrap:balance}
h2{font-size:var(--text-lg);line-height:1.2}
p{max-width:72ch}
button,input,select{font:inherit;color:inherit;min-height:44px;

  background:var(--color-surface);padding:var(--space-2) var(--space-3)}
button{cursor:pointer;font-size:var(--text-sm);font-weight:700}
button:hover{background:var(--color-surface-2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:var(--color-primary);color:var(--color-primary-text);border-color:transparent}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px}
a{color:var(--color-primary)}
.skip{position:absolute;left:-10000px}.skip:focus{left:var(--space-4);top:var(--space-4)}
header{padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-divider)}
.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.between{justify-content:space-between}
.brand svg{width:32px;height:32px;color:var(--color-primary)}
.eyebrow,.muted{color:var(--color-text-muted)}
.eyebrow{font-size:var(--text-xs);letter-spacing:.08em;text-transform:uppercase}
.small{font-size:var(--text-sm)}
main{max-width:1500px;margin-inline:auto;padding:var(--space-6)}
.notice{margin-top:var(--space-4);padding:var(--space-3) var(--space-4);
  background:var(--color-surface-2);border-radius:var(--radius-sm);font-size:var(--text-sm)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:var(--space-6);margin-top:var(--space-6)}
.panel{background:var(--color-surface);border:1px solid var(--color-divider);
  border-radius:var(--radius-lg);padding:var(--space-5);min-width:0}
.panel+.panel{margin-top:var(--space-5)}
.panel h2{margin-bottom:var(--space-4)}
label{display:block;margin-top:var(--space-4);font-size:var(--text-sm);font-weight:700}
label input,label select{display:block;width:100%;margin-top:var(--space-2);font-size:var(--text-base)}
fieldset{border:0}legend{font-weight:700;margin-bottom:var(--space-3)}
.routes{display:grid;gap:var(--space-2)}
.routes button{text-align:left}
.routes button[aria-pressed="true"]{color:var(--color-primary);border-color:var(--color-primary);
  background:color-mix(in oklch,var(--color-primary) 8%,var(--color-surface))}
form .primary{width:100%;margin-top:var(--space-5)}
.banner{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--space-4);
